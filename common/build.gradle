plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'org.spongepowered.gradle.vanilla'
}
base {
    archivesName = "${mod_id}-common-${minecraft_version}"
}
minecraft {
    version(minecraft_version)
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly("dev.kosmx.player-anim:player-animation-lib-forge:${project.player_anim_version}")
    compileOnly("maven.modrinth:entity-model-features:${project.emf_version}")

    testImplementation(platform("org.junit:junit-bom:${project.junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${project.player_anim_version}")
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    configure(options) {
        tags(
                'apiNote:a:"API Note:"',
                'implNote:a:"Implementation Note:"'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
